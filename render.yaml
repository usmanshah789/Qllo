# One service: the image builds the React app and the API serves it, so there
# is a single URL and nothing to wire between two halves.
#
# Create it from the Render dashboard with "New > Blueprint" pointed at this
# repository. The two keys are sync:false, so Render asks for them instead of
# reading them from this file - they are never committed.
services:
  - type: web
    name: taste-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Sessions live on the container's own disk, which Render replaces on
      # every deploy. Fine for a demo; attach a Render Disk mounted at /data
      # if conversations need to outlive a redeploy.
      - key: DATA_DIR
        value: /data
